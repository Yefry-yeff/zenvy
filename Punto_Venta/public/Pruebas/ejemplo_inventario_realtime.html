<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenvy - Inventario en Tiempo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen p-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">📦 Inventario Zenvy</h1>
            <p class="text-gray-600">Sincronización en tiempo real</p>
        </div>

        <!-- Status -->
        <div class="mb-6 bg-white rounded-lg shadow p-4">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-blue-50 rounded p-3">
                    <p class="text-sm text-gray-600">Categorías</p>
                    <p class="text-2xl font-bold text-blue-600" id="total-categories">-</p>
                </div>
                <div class="bg-purple-50 rounded p-3">
                    <p class="text-sm text-gray-600">Productos</p>
                    <p class="text-2xl font-bold text-purple-600" id="total-products">-</p>
                </div>
                <div class="bg-green-50 rounded p-3">
                    <p class="text-sm text-gray-600">Stock Total</p>
                    <p class="text-2xl font-bold text-green-600" id="total-stock">-</p>
                </div>
                <div class="bg-gray-50 rounded p-3">
                    <p class="text-sm text-gray-600">Última Actualización</p>
                    <p class="text-sm font-mono text-gray-600" id="last-update">-</p>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="mb-6 bg-white rounded-lg shadow p-4 flex gap-2 flex-wrap">
            <button onclick="startSync()" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700">
                ▶ Iniciar Sincronización
            </button>
            <button onclick="stopSync()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                ⏹ Detener Sincronización
            </button>
            <button onclick="refreshNow()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                🔄 Actualizar Ahora
            </button>
        </div>

        <!-- Filter -->
        <div class="mb-6 bg-white rounded-lg shadow p-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Filtrar por Categoría:</label>
            <select id="category-filter" onchange="filterByCategory()" class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <option value="">Todas las categorías</option>
            </select>
        </div>

        <!-- Products Container -->
        <div id="products-container" class="space-y-6">
            <div class="bg-white rounded-lg shadow p-8 text-center">
                <p class="text-gray-500">Cargando inventario...</p>
            </div>
        </div>
    </div>

    <script src="zenvy-inventory-client.js"></script>
    <script>
        // Configuración
        const API_BASE_URL = 'http://localhost:8000';
        const TOKEN = localStorage.getItem('inventory_token') || 'tu_token_aqui';
        
        let inventoryClient = null;
        let currentData = null;
        let currentFilter = '';

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            inventoryClient = new ZenvyInventoryClient(API_BASE_URL, TOKEN);
            console.log('Cliente de inventario inicializado');
        });

        /**
         * Iniciar sincronización
         */
        function startSync() {
            if (!TOKEN || TOKEN === 'tu_token_aqui') {
                alert('⚠️ Por favor configura el TOKEN en localStorage o en el código');
                return;
            }

            // Sincronizar productos cada 30 segundos
            inventoryClient.startProductsCategorySync((error, data) => {
                if (error) {
                    console.error('Error:', error);
                    showError('Error al sincronizar inventario');
                    return;
                }

                currentData = data;
                updateUI(data);
                updateCategoryFilter(data);
            }, 30000);

            console.log('✅ Sincronización iniciada');
            alert('✅ Sincronización iniciada (cada 30 segundos)');
        }

        /**
         * Detener sincronización
         */
        function stopSync() {
            inventoryClient.stopAllSync();
            console.log('⏹ Sincronización detenida');
            alert('⏹ Sincronización detenida');
        }

        /**
         * Actualizar ahora
         */
        async function refreshNow() {
            try {
                const data = await inventoryClient.getProductsByCategory();
                currentData = data;
                updateUI(data);
                updateCategoryFilter(data);
                console.log('🔄 Actualizado');
            } catch (error) {
                showError('Error al actualizar');
            }
        }

        /**
         * Actualizar UI con datos
         */
        function updateUI(data) {
            if (!data || !data.data) return;

            // Actualizar totales
            document.getElementById('total-categories').textContent = data.meta.total_categories;
            document.getElementById('total-products').textContent = data.meta.total_products;
            document.getElementById('total-stock').textContent = data.meta.total_stock;
            document.getElementById('last-update').textContent = new Date(data.meta.timestamp).toLocaleTimeString();

            // Renderizar productos
            const container = document.getElementById('products-container');
            
            const filteredData = currentFilter 
                ? data.data.filter(cat => cat.categoria_id == currentFilter)
                : data.data;

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-lg shadow p-8 text-center">
                        <p class="text-gray-500">No hay productos en esta categoría</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredData.map(category => `
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <!-- Encabezado de Categoría -->
                    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6">
                        <h2 class="text-2xl font-bold">${category.categoria_nombre}</h2>
                        <p class="text-blue-100 text-sm mt-1">${category.categoria_descripcion}</p>
                        <div class="mt-4 flex gap-6 text-sm">
                            <div>
                                <span class="opacity-75">Productos:</span>
                                <span class="font-bold ml-2">${category.total_productos}</span>
                            </div>
                            <div>
                                <span class="opacity-75">Stock Total:</span>
                                <span class="font-bold ml-2">${category.stock_total}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla de Productos -->
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">Producto</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase tracking-wider">SKU</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-700 uppercase tracking-wider">Stock</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-700 uppercase tracking-wider">Precio Venta</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-700 uppercase tracking-wider">Margen</th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200">
                                ${category.productos.map(producto => `
                                    <tr class="hover:bg-gray-50 transition-colors">
                                        <td class="px-6 py-4">
                                            <div class="text-sm font-medium text-gray-900">${producto.nombre}</div>
                                            <div class="text-xs text-gray-500">Código: ${producto.codigo_barra}</div>
                                        </td>
                                        <td class="px-6 py-4 text-sm text-gray-600">${producto.sku}</td>
                                        <td class="px-6 py-4 text-right">
                                            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium ${
                                                producto.stock > 10 ? 'bg-green-100 text-green-800' :
                                                producto.stock > 5 ? 'bg-yellow-100 text-yellow-800' :
                                                'bg-red-100 text-red-800'
                                            }">
                                                ${producto.stock} unidades
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-right text-sm font-medium text-gray-900">
                                            L ${producto.precio_venta.toFixed(2)}
                                        </td>
                                        <td class="px-6 py-4 text-right text-sm">
                                            <span class="text-green-600 font-medium">${producto.margen}%</span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `).join('');
        }

        /**
         * Actualizar filtro de categorías
         */
        function updateCategoryFilter(data) {
            if (!data || !data.data) return;

            const select = document.getElementById('category-filter');
            const currentValue = select.value;

            select.innerHTML = '<option value="">Todas las categorías</option>' +
                data.data.map(cat => `
                    <option value="${cat.categoria_id}">${cat.categoria_nombre} (${cat.stock_total} stock)</option>
                `).join('');

            select.value = currentValue;
        }

        /**
         * Filtrar por categoría
         */
        function filterByCategory() {
            currentFilter = document.getElementById('category-filter').value;
            if (currentData) {
                updateUI(currentData);
            }
        }

        /**
         * Mostrar error
         */
        function showError(message) {
            const alert = document.createElement('div');
            alert.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-lg shadow-lg';
            alert.textContent = message;
            document.body.appendChild(alert);

            setTimeout(() => alert.remove(), 5000);
        }

        // Iniciar automáticamente (comentar si prefieres botón)
        // window.addEventListener('load', startSync);
    </script>
</body>
</html>
