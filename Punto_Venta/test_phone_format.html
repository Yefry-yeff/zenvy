<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Formato Teléfono</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-control[maxlength="9"] {
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
        }
        .form-control {
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .form-text.text-muted {
            font-size: 0.8rem;
            color: #6c757d !important;
            margin-top: 0.25rem;
        }
        .form-control::placeholder {
            color: #adb5bd;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Prueba de Formateo Automático de Teléfono</h3>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text"
                                   id="telefono"
                                   class="form-control"
                                   placeholder="2234-5678"
                                   maxlength="9"
                                   x-data="{ value: '' }"
                                   x-model="value"
                                   @input="
                                       let inputValue = $event.target.value.replace(/\D/g, '');
                                       if (inputValue.length > 4) {
                                           inputValue = inputValue.substring(0, 4) + '-' + inputValue.substring(4, 8);
                                       }
                                       $event.target.value = inputValue;
                                       value = inputValue;
                                   "
                                   @keypress="
                                       if (!/[\d]/.test($event.key) &&
                                           !['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'].includes($event.key)) {
                                           $event.preventDefault();
                                       }
                                   ">
                            <small class="form-text text-muted">Formato: ####-####</small>
                        </div>

                        <div class="mb-3">
                            <label for="celular" class="form-label">Celular</label>
                            <input type="text"
                                   id="celular"
                                   class="form-control"
                                   placeholder="9876-5432"
                                   maxlength="9"
                                   x-data="{ value: '' }"
                                   x-model="value"
                                   @input="
                                       let inputValue = $event.target.value.replace(/\D/g, '');
                                       if (inputValue.length > 4) {
                                           inputValue = inputValue.substring(0, 4) + '-' + inputValue.substring(4, 8);
                                       }
                                       $event.target.value = inputValue;
                                       value = inputValue;
                                   "
                                   @keypress="
                                       if (!/[\d]/.test($event.key) &&
                                           !['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'].includes($event.key)) {
                                           $event.preventDefault();
                                       }
                                   ">
                            <small class="form-text text-muted">Formato: ####-####</small>
                        </div>

                        <div class="alert alert-info">
                            <h5>Instrucciones de prueba:</h5>
                            <ul>
                                <li>Escribe solo números</li>
                                <li>Al escribir el quinto dígito, automáticamente se agregará el guión</li>
                                <li>Solo se permiten números (las letras se bloquean)</li>
                                <li>Máximo 9 caracteres (####-####)</li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
